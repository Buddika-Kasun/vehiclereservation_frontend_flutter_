<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <!-- Base href - IMPORTANT for Railway -->
  <base href="/">

  <!-- Viewport for mobile - FIXED -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA Meta Tags - FIXED for iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- Change from black-translucent to black or default -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="PCW RIDE">

  <!-- Theme Color - IMPORTANT for Android -->
  <meta name="theme-color" content="#ff8000">
  <!-- Apple Status Bar Color -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Safari Pinned Tab Color -->
  <meta name="msapplication-TileColor" content="#ff8000">

  <!-- Description -->
  <meta name="description" content="PCW RIDE - Vehicle Reservation System">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <!-- Title -->
  <title>PCW RIDE</title>

  <!-- CRITICAL: Preload main resources for faster loading -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- Inline Loading CSS (no extra request) - FIXED for iOS -->
  <style>
    /* Reset for full screen */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      position: fixed;
      /* Prevent bounce scroll on iOS */
    }

    /* iOS Safe Area Insets */
    @supports (padding: max(0px)) {
      body {
        padding-top: env(safe-area-inset-top);
        padding-bottom: env(safe-area-inset-bottom);
        padding-left: env(safe-area-inset-left);
        padding-right: env(safe-area-inset-right);
      }
    }

    #flutter-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffea00 0%, #ff9f19 70%, #ff8000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.3s ease;
      /* iOS Safe Area */
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    .loader-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* Hide loader when Flutter loads */
    .flutter-loaded #flutter-loader {
      opacity: 0;
      pointer-events: none;
    }

    /* Prevent text selection */
    .no-select {
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }
  </style>
</head>

<body class="no-select">
  <!-- Loading Screen -->
  <div id="flutter-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading PCW RIDE...</div>
  </div>

  <!-- Railway Configuration -->
  <script>
    // Railway will inject actual values during deployment
    // This is a fallback for local development
    window.config = window.config || {
      apiUrl: 'https://pcw-ride-server.up.railway.app',
      wsUrl: 'wss://pcw-ride-server.up.railway.app',
      environment: 'production'
    };

    // iOS Full Screen Fix
    function setupIOSFullScreen() {
      // Detect iOS
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;

      if (isIOS) {
        // Fix for iOS 15+ notch/safe areas
        const metaViewport = document.querySelector('meta[name=viewport]');
        if (metaViewport) {
          metaViewport.setAttribute('content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }

        // Prevent elastic scrolling
        document.body.style.overflow = 'hidden';
        document.documentElement.style.overflow = 'hidden';

        // Fix for 100vh issue on iOS
        function setRealViewportHeight() {
          const vh = window.innerHeight * 0.01;
          document.documentElement.style.setProperty('--vh', `${vh}px`);
        }

        setRealViewportHeight();
        window.addEventListener('resize', setRealViewportHeight);
        window.addEventListener('orientationchange', setRealViewportHeight);
      }
    }

    // Show loading state immediately
    document.body.classList.add('loading');

    // Setup iOS fixes
    setupIOSFullScreen();

    // Error handling for failed loads
    window.addEventListener('error', function (e) {
      console.error('Script loading error:', e);
      var loader = document.getElementById('flutter-loader');
      if (loader) {
        loader.innerHTML = '<div style="color: white; text-align: center; padding: 20px;">' +
          '<h3>Loading Error</h3>' +
          '<p>Please refresh the page</p>' +
          '<button onclick="location.reload()" style="margin-top: 10px; padding: 10px 20px; background: white; border: none; border-radius: 5px; cursor: pointer;">Retry</button>' +
          '</div>';
      }
    });

    // When Flutter is ready, hide loader
    window.addEventListener('flutter-first-frame', function () {
      console.log('Flutter app loaded');
      document.body.classList.remove('loading');
      document.body.classList.add('flutter-loaded');

      // Fix for iOS after Flutter loads
      const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
      if (isIOS) {
        // Add iOS specific class
        document.body.classList.add('ios-device');

        // Force repaint for iOS
        setTimeout(() => {
          document.body.style.height = window.innerHeight + 'px';
        }, 100);
      }

      // Optional: Send to analytics
      if (window.config && window.config.environment === 'production') {
        // Your analytics code here
      }
    });

    // Fallback: hide loader after 10 seconds max
    setTimeout(function () {
      document.body.classList.add('flutter-loaded');
    }, 10000);

    // Prevent bounce scrolling on iOS
    document.addEventListener('touchmove', function (e) {
      if (e.scale !== 1) {
        e.preventDefault();
      }
    }, { passive: false });
  </script>

  <!-- Flutter Bootstrap Script -->
  <script src="flutter_bootstrap.js" async></script>

  <!-- Service Worker Registration (for PWA) -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('flutter_service_worker.js', {
          scope: '/'
        }).then(function (registration) {
          console.log('ServiceWorker registration successful with scope: ', registration.scope);
        }).catch(function (err) {
          console.log('ServiceWorker registration failed: ', err);
        });
      });
    }
  </script>

  <!-- Performance Monitoring -->
  <script>
    // Log performance metrics
    window.addEventListener('load', function () {
      if (window.performance && window.performance.timing) {
        var perf = window.performance.timing;
        var loadTime = perf.loadEventEnd - perf.navigationStart;
        console.log('Page fully loaded in ' + loadTime + 'ms');

        // Send to analytics if in production
        if (window.config && window.config.environment === 'production' && loadTime > 0) {
          // Your performance tracking code here
        }
      }
    });
  </script>
</body>

</html>
