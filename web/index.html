<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <base href="/">

  <!-- Viewport -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- PWA Meta Tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <!-- BLACK STATUS BAR -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <meta name="apple-mobile-web-app-title" content="PCW RIDE">

  <!-- Theme Color -->
  <meta name="theme-color" content="#000000">

  <!-- Description -->
  <meta name="description" content="PCW RIDE - Vehicle Reservation System">

  <!-- Favicon & App Icons -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="manifest" href="manifest.json">

  <title>PCW RIDE</title>

  <!-- Preload -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    #flutter-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffea00 0%, #ff9f19 70%, #ff8000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    .loader-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .flutter-loaded #flutter-loader {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="flutter-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading PCW RIDE...</div>
  </div>

  <script>
    window.config = window.config || {
      apiUrl: 'https://pcw-ride-server.up.railway.app',
      wsUrl: 'wss://pcw-ride-server.up.railway.app',
      environment: 'production'
    };

    document.body.classList.add('loading');

    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.remove('loading');
      document.body.classList.add('flutter-loaded');
    });

    setTimeout(function () {
      document.body.classList.add('flutter-loaded');
    }, 10000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>

</html>
