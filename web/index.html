  <!-- FORCE UPDATE - ADD THIS TO YOUR LOCAL web/index.html -->
  <script>
    // NUCLEAR OPTION - Force update for ALL users
    (function () {
      // 1. Unregister ALL service workers immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function (registrations) {
          registrations.forEach(function (registration) {
            console.log('Unregistering service worker:', registration.scope);
            registration.unregister();
          });
        });
      }

      // 2. Clear ALL caches
      if ('caches' in window) {
        caches.keys().then(function (cacheNames) {
          cacheNames.forEach(function (cacheName) {
            console.log('Deleting cache:', cacheName);
            caches.delete(cacheName);
          });
        });
      }

      // 3. Force reload if page is loaded from cache
      window.addEventListener('pageshow', function (event) {
        if (event.persisted) {
          console.log('Page loaded from cache, forcing reload');
          window.location.reload();
        }
      });

      // 4. Add version to prevent caching
      window.BUILD_VERSION = 'FORCE_UPDATE_' + Date.now();
    })();
  </script>
  
  <meta charset="UTF-8">
  <base href="/">

  <!-- Viewport - IMPORTANT for iOS Home Screen -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- PWA Meta Tags - MUST be in this order -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">

  <!-- iOS Status Bar - For Home Screen App -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">

  <!-- Theme Colors - For different contexts -->
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">

  <!-- Apple specific -->
  <meta name="apple-mobile-web-app-title" content="PCW RIDE">
  <meta name="format-detection" content="telephone=no">
  <meta name="apple-touch-fullscreen" content="yes">

  <!-- Description -->
  <meta name="description" content="PCW RIDE - Vehicle Reservation System">

  <!-- App Icons for Home Screen -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <!-- Apple Startup Image (optional but helps) -->
  <link rel="apple-touch-startup-image" href="icons/Icon-512.png">

  <title>PCW RIDE</title>

  <!-- Preload -->
  <link rel="preload" href="flutter_bootstrap.js" as="script">
  <link rel="preload" href="main.dart.js" as="script">

  <!-- iOS Home Screen App CSS Fix -->
  <style>
    /* iOS Home Screen App specific styles */
    @media all and (display-mode: standalone) {

      /* This targets when app is launched from home screen */
      body {
        background-color: #000000;
        /* Black background for status bar area */
      }

      /* Force black status bar */
      #status-bar-fix {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: env(safe-area-inset-top);
        background-color: #000000;
        z-index: 10000;
      }
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #flutter-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #ffea00 0%, #ff9f19 70%, #ff8000 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .loader-spinner {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
      margin-bottom: 20px;
    }

    .loader-text {
      color: white;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 18px;
      font-weight: 500;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .flutter-loaded #flutter-loader {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <!-- iOS Status Bar Fix Element -->
  <div id="status-bar-fix"></div>

  <!-- Loading Screen -->
  <div id="flutter-loader">
    <div class="loader-spinner"></div>
    <div class="loader-text">Loading PCW RIDE...</div>
  </div>

  <script>
    // Detect if launched from home screen
    const isStandalone = window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone === true;

    console.log('Is Home Screen App:', isStandalone);

    // iOS Home Screen App Fix
    if (isStandalone) {
      // Force black status bar for home screen app
      document.documentElement.style.backgroundColor = '#000000';
      document.body.style.backgroundColor = '#000000';

      // Set iOS status bar color
      const meta = document.createElement('meta');
      meta.name = 'apple-mobile-web-app-status-bar-style';
      meta.content = 'black';
      document.head.appendChild(meta);
    }

    window.config = window.config || {
      apiUrl: 'https://pcw-ride-server.up.railway.app',
      wsUrl: 'wss://pcw-ride-server.up.railway.app',
      environment: 'production'
    };

    document.body.classList.add('loading');

    window.addEventListener('flutter-first-frame', function () {
      document.body.classList.remove('loading');
      document.body.classList.add('flutter-loaded');

      // Remove status bar fix after Flutter loads
      const fix = document.getElementById('status-bar-fix');
      if (fix) {
        fix.style.display = 'none';
      }
    });

    setTimeout(function () {
      document.body.classList.add('flutter-loaded');
    }, 10000);

    // iOS specific fixes
    const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
    if (isIOS) {
      // Fix for home screen app status bar
      document.addEventListener('DOMContentLoaded', function () {
        // Add iOS home screen app class
        if (isStandalone) {
          document.body.classList.add('ios-standalone');
        }

        // Set status bar color for iOS
        const viewportMeta = document.querySelector('meta[name="viewport"]');
        if (viewportMeta && isStandalone) {
          viewportMeta.setAttribute('content',
            'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover');
        }
      });
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>

  <!-- iOS Home Screen App JavaScript -->
  <script>
    // Additional iOS home screen fix
    if (window.navigator.standalone) {
      // Running in iOS standalone mode (home screen)
      document.addEventListener('DOMContentLoaded', function () {
        // Create a style element to force black status bar
        const style = document.createElement('style');
        style.textContent = `
          /* Force black status bar for home screen app */
          body:before {
            content: '';
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: env(safe-area-inset-top);
            background: #000000;
            z-index: 99999;
          }
        `;
        document.head.appendChild(style);

        // Also set theme-color dynamically
        const themeMeta = document.querySelector('meta[name="theme-color"]');
        if (themeMeta) {
          themeMeta.setAttribute('content', '#000000');
        }
      });
    }
  </script>
</body>
